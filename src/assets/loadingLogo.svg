<svg
  width="64"
  height="64"
  viewBox="0 0 50 50"
  xmlns="http://www.w3.org/2000/svg"
>
  <circle
    cx="25"
    cy="25"
    r="20"
    fill="none"
    stroke="#E5E7EB"
    stroke-width="5"
  />
  <circle
    cx="25"
    cy="25"
    r="20"
    fill="none"
    stroke="#16A34A"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="31.4 188.4"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 25 25"
      to="360 25 25"
      dur="1s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
